<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DZD Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    h1{
      text-align:center;
      color:#38bdf8;
    }

    .card{
      background:#1e293b;
      padding:20px;
      margin-top:20px;
      border-radius:15px;
    }

    .price{
      font-size:28px;
      color:#22c55e;
    }
  </style>
</head>
<body>

<h1>DZD Market</h1>

<div id="prices"></div>

<script>

const supabaseUrl = "https://bcmngzompyojuffepstk.supabase.co/rest/v1/";
const supabaseKey = "sb_publishable_8ZqJ7RH9irgwN_0Wo6wD-g_ZjKO8DXS";

const client = supabase.createClient(supabaseUrl, supabaseKey);

async function loadPrices() {

  const { data, error } = await client
    .from('prices')
    .select('*');

  if(error){
    console.log(error);
    return;
  }

  const container = document.getElementById("prices");

  container.innerHTML = "";

  data.forEach(item => {

    container.innerHTML += `
      <div class="card">
        <h2>${item.name}</h2>
        <div class="price">${item.price} DZD</div>
        <p>✅ Confirmé par ${item.confirmations} utilisateurs</p>
      </div>
    `;

  });

}

loadPrices();

</script>

</body>
</html>
