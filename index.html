<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DZD Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

 <style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020617;
  color:white;
  font-family:Arial, sans-serif;
  padding:20px;
}

h1{
  text-align:center;
  color:#38bdf8;
  margin-bottom:30px;
  font-size:38px;
}

#prix{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#0f172a;
  border:1px solid #1e293b;
  padding:20px;
  border-radius:20px;
  transition:0.3s;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.card:hover{
  transform:translateY(-5px);
  border-color:#38bdf8;
}

.card h2{
  color:#e2e8f0;
  margin-bottom:15px;
}

.price{
  font-size:32px;
  color:#22c55e;
  font-weight:bold;
  margin-bottom:10px;
}

.card p{
  color:#94a3b8;
}
 </style>
</head>
<body>

<h1>DZD Market</h1>

<div id="prix"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://bcmngzompyojuffepstk.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbW5nem9tcHlvanVmZmVwc3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTM2MDYsImV4cCI6MjA5NDk2OTYwNn0.15SBxqm0g2odZgSJi_iJlhTVGn7R3uuP2xH0-kV-Afg";

const { createClient } = supabase;
const client = createClient(supabaseUrl, supabaseKey);

async function loadPrices() {
  const { data, error } = await client
    .from('prix')
    .select('*');
  if (error) {
    console.log(error);
    return;
  }

  const recipient = document.getElementById("prix");

  recipient.innerHTML = "";

data.forEach(item => {

  recipient.innerHTML += `
    <div class="card">
      <h2>${item.devise}</h2>
      <div class="price">
  ${Number(item.prix).toLocaleString()} DZD
</div>
      <p>📌 ${item.source}</p>
    </div>
  `;

});

}

loadPrices();
</script>
</body>
</html>
