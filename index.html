<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DZD Market</title>


 <style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020617;
  color:white;
  font-family:Arial, sans-serif;
  padding:20px;
  background:
radial-gradient(circle at top,#0f172a,#020617);
}

h1{
  text-align:center;
  color:#38bdf8;
  margin-bottom:30px;
  font-size:38px;
}

#prix{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#0f172a;
  border:1px solid #1e293b;
  padding:20px;
  border-radius:20px;
  transition:0.3s;
  box-shadow:
0 0 15px rgba(0,0,0,0.3),
0 0 25px rgba(56,189,248,0.08);
}

.card:hover{
  transform:translateY(-5px);
  border-color:#38bdf8;
  box-shadow:
0 0 25px rgba(56,189,248,0.25),
0 0 50px rgba(56,189,248,0.12);
}

.card h2{
  color:#e2e8f0;
  margin-bottom:15px;
}

.price{
  font-size:32px;
  color:#22c55e;
  font-weight:bold;
  margin-bottom:10px;
}

.card p{
  color:#94a3b8;
}
   .header{
  text-align:center;
  margin-bottom:40px;
}

.header p{
  color:#94a3b8;
  margin-top:10px;
  font-size:18px;
}

.card{
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:5px;
  height:100%;
  background:#38bdf8;
}

.update{
  margin-top:15px;
  color:#64748b;
  font-size:14px;
}
   .form{
  margin-top:40px;
  background:#0f172a;
  padding:20px;
  border-radius:20px;
  border:1px solid #1e293b;
}

.form input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  border:none;
  border-radius:10px;
  background:#1e293b;
  color:white;
  font-size:16px;
}

.form button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#38bdf8;
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

.form button:hover{
  opacity:0.8;
}
   #search{
  width:100%;
  padding:15px;
  margin-bottom:25px;
  border:none;
  border-radius:15px;
  background:#0f172a;
  color:white;
  font-size:16px;
  border:1px solid #1e293b;
}
   .image{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:15px;
  margin-bottom:15px;
   }
   .card button{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

.card button:hover{
  opacity:0.8;
}
   .trend{
  margin-top:10px;
  background:#f97316;
  color:white;
  padding:8px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
}
   .new{
  margin-top:10px;
  background:#06b6d4;
  color:white;
  padding:8px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
   }
   #stats{
  margin-top:15px;
  color:#94a3b8;
  font-size:18px;
   }
   .filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.filters button{
  padding:10px 15px;
  border:none;
  border-radius:12px;
  background:#1e293b;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.filters button:hover{
  background:#38bdf8;
}
   @media(max-width:768px){

  body{
    padding:15px;
  }

  h1{
    font-size:30px;
  }

  .filters{
    overflow-x:auto;
    flex-wrap:nowrap;
    padding-bottom:10px;
  }

  .filters button{
    min-width:max-content;
  }

  .card{
    padding:15px;
  }

  .price{
    font-size:26px;
  }

  .image{
    height:160px;
  }

  .form{
    padding:15px;
  }

   }
   #loading{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.skeleton{
  height:250px;
  border-radius:20px;
  background:linear-gradient(
    90deg,
    #0f172a 25%,
    #1e293b 50%,
    #0f172a 75%
  );

  background-size:200% 100%;

  animation:loading 1.5s infinite;
}

@keyframes loading{

  0%{
    background-position:200% 0;
  }

  100%{
    background-position:-200% 0;
  }

}
   .main-rate{
  margin-top:10px;
  background:#eab308;
  color:black;
  padding:8px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
   }
   .up{
  color:#22c55e;
  font-weight:bold;
}

.down{
  color:#ef4444;
  font-weight:bold;
}
   
 </style>
</head>
<body>

<header class="header">
  <h1>DZD market</h1>
  <p>Suivi des prix en Algérie 🇩🇿</p>
  <div id="stats"></div>
</header>
<input 
  type="text" 
  id="search"
  placeholder="🔎 Rechercher..."
  onkeyup="searchPrices()"
/>
  <div class="filters">

  <button onclick="filterCategory('all')">🌍 Tous</button>

  <button onclick="filterCategory('Devises')">💵 Devises</button>

  <button onclick="filterCategory('Or')">🪙 Or</button>

  <button onclick="filterCategory('Électronique')">📱 Électronique</button>

  <button onclick="filterCategory('Gaming')">🎮 Gaming</button>

  </div>
  
<div id="loading">

  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>

</div>

<div id="prix"></div>
<div class="form">

  <input type="text" id="devise" placeholder="Nom du produit ou devise">

  <input type="number" id="prixInput" placeholder="Prix en DZD">

  <input type="text" id="source" placeholder="Source">
  <select id="category">

  <option value="Devises">💵 Devises</option>

  <option value="Or">🪙 Or</option>

  <option value="Électronique">📱 Électronique</option>

  <option value="Gaming">🎮 Gaming</option>

  </select>

  <button onclick="addPrice()">Ajouter</button>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://bcmngzompyojuffepstk.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbW5nem9tcHlvanVmZmVwc3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTM2MDYsImV4cCI6MjA5NDk2OTYwNn0.15SBxqm0g2odZgSJi_iJlhTVGn7R3uuP2xH0-kV-Afg";

const { createClient } = supabase;
const client = createClient(supabaseUrl, supabaseKey);

async function loadPrices() {
  const { data, error } = await client
    .from('prix')
    .select('*')
  .order('id', { ascending: false });
  if (error) {
    console.log(error);
    return;
  }

  const recipient = document.getElementById("prix");

  recipient.innerHTML = "";
  document.getElementById("loading").style.display = "none";
  document.getElementById("stats").innerHTML =
`📊 ${data.length} Prix suivis en direct`;

const priority = ["EUR/DZD", "USD/DZD"];

data.sort((a, b) => {

  const aPriority = priority.includes(a.devise) ? 0 : 1;

  const bPriority = priority.includes(b.devise) ? 0 : 1;

  return aPriority - bPriority;

});

data.forEach(item => {

  recipient.innerHTML += `
    <div class="card">
    
      <img src="${item.image}" class="image">
      
      <h2>${item.devise}</h2>

      ${item.devise === "EUR/DZD" || item.devise === "USD/DZD" ? `
<div class="main-rate">⭐ Taux principal</div>
` : ""}

      <div class="price">
  ${Number(item.prix).toLocaleString()} DZD
</div>
<p>🏷️ ${item.category}</p>
<p>📌 ${item.source}</p>

<p class="${item.variation && item.variation.includes('📈') ? 'up' : 'down'}">
${item.variation || ""}
</p>
      
<p>👥 Confirmé par ${item.confirme_par}</p>

${item.confirme_par >= 5 ? `
<div class="trend">🔥 Tendance</div>
` : ""}

<button onclick="confirmPrice(${item.id}, ${item.confirme_par})">
👍 Confirmer
</button>

${Date.now() - new Date(item.created_at) < 172800000 ? `
<div class="new">🆕 Nouveau</div>
` : ""}

<div class="update">
🕒 ${new Date(item.created_at).toLocaleDateString()}
</div>
    </div>
  `;

});

}
async function addPrice(){

  const devise = document.getElementById("devise").value;

  const prix = document.getElementById("prixInput").value;

  const source = document.getElementById("source").value;
  const category = document.getElementById("category").value;

  const { error } = await client
    .from('prix')
    .insert([
      {
        devise,
        prix,
        source,
        category,
        confirme_par: 1
      }
    ]);

  if(error){
    alert("Erreur");
    console.log(error);
    return;
  }

  alert("Prix ajouté ✅");

  loadPrices();

}
  function searchPrices(){

  const value = document
    .getElementById("search")
    .value
    .toLowerCase();

  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {

    if(card.innerText.toLowerCase().includes(value)){
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }

  });

}
  async function confirmPrice(id, current){
    
    if(localStorage.getItem("confirmed_" + id)){

  alert("Déjà confirmé ✅");
  return;

}

  const { error } = await client
    .from('prix')
    .update({
      confirme_par: current + 1
    })
    .eq('id', id);

  if(error){
    console.log(error);
    return;
  }

  if(error){
    console.log(error);
    return;
  }
    
localStorage.setItem("confirmed_" + id, true);
    
  loadPrices();
    

}
  function filterCategory(category){

  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {

    if(category === "all"){
      card.style.display = "block";
      return;
    }

    if(card.innerText.includes(category)){
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }

  });

  }
  
loadPrices();
</script>
</body>
</html>
