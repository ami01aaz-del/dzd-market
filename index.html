<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DZD Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    h1{
      text-align:center;
      color:#38bdf8;
    }

    .card{
      background:#1e293b;
      padding:20px;
      margin-top:20px;
      border-radius:15px;
    }

    .price{
      font-size:28px;
      color:#22c55e;
    }
  </style>
</head>
<body>

<h1>DZD Market</h1>

<div id="prix"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseUrl = "https://bcmngzompyojuffepstk.supabase.co";
const supabaseKey = "sb_publishable_8ZqJ7RH9irgwN_0Wo6wD-g_ZjKO8DXS";

const client = supabase.createClient(supabaseUrl, supabaseKey);

async function loadPrices() {

  const { data, error } = await client
    .from('prix')
    .select('*');

  if (error) {
    console.log(error);
    return;
  }

  const recipient = document.getElementById("prix");

  recipient.innerHTML = "";

data.forEach(item => {
  recipient.innerHTML += `
    <div class="card">
      <pre>${JSON.stringify(item, null, 2)}</pre>
    </div>
  `;
});

}

loadPrices();
</script>
</body>
</html>
