<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZD Market</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      text-align:center;
    }

    header{
      padding:30px;
      background:#111827;
      font-size:32px;
      font-weight:bold;
      color:#22c55e;
    }

    .container{
      padding:20px;
    }

    .card{
      background:#1e293b;
      padding:20px;
      margin:15px auto;
      max-width:350px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.3);
    }

    .price{
      font-size:28px;
      margin-top:10px;
      color:#22c55e;
    }

    .confirm{
      margin-top:10px;
      color:#94a3b8;
    }
  </style>
</head>

<body>

<header>
  DZD Market
</header>

<div class="container">

  <div class="card">
    <h2>EUR / DZD</h2>
    <div class="price">280 DZD</div>
    <div class="confirm">✅ Confirmed by 15 users</div>
  </div>

  <div class="card">
    <h2>USD / DZD</h2>
    <div class="price">255 DZD</div>
    <div class="confirm">✅ Confirmed by 10 users</div>
  </div>

  <div class="card">
    <h2>Gold 24K</h2>
    <div class="price">14500 DZD</div>
    <div class="confirm">✅ Confirmed by 5 users</div>
  </div>

</div>

</body>
</html>
