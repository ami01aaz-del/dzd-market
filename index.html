<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DZD Market - Marché Algérien</title>

<link rel="icon" type="image/png" href="/icon-new.png">

<meta name="description" content="DZD Market - Suivi des prix en Algérie">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:white;
}

header{
padding:20px;
text-align:center;
background:#0f172a;
border-bottom:1px solid #1e293b;
}

h1{
margin:0;
color:#38bdf8;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.section{
margin-top:25px;
background:#0f172a;
padding:15px;
border-radius:12px;
border:1px solid #1e293b;
}

.title{
font-size:20px;
margin-bottom:10px;
color:#22c55e;
}

.row{
display:flex;
justify-content:space-between;
padding:10px;
background:#111827;
border-radius:8px;
margin-top:10px;
}

.small{
font-size:13px;
opacity:0.7;
}

.green{
color:#22c55e;
}

.blue{
color:#38bdf8;
}

.currency-link{
color:white;
text-decoration:none;
font-weight:bold;
}

input,
select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#162033;
color:white;
font-size:18px;
box-sizing:border-box;
}

footer{
text-align:center;
padding:20px;
opacity:0.6;
font-size:12px;
}

</style>

</head>

<body>

<header>

<h1>🇩🇿 DZD Market</h1>

<p class="small">
Marché algérien - Prix en temps réel
</p>

</header>

<div class="container">

<!-- DEVISES -->

<div class="section">

<div class="title">
💱 Devises (Square + Officiel)
</div>

<div class="row">
<span>
<a href="#" class="currency-link">
EUR/DZD
</a>
</span>

<span class="green" id="eur-rate">
Chargement...
</span>
</div>

<div class="row">
<span>
<a href="#" class="currency-link">
USD/DZD
</a>
</span>

<span class="green" id="usd-rate">
Chargement...
</span>
</div>

<p class="small" style="margin-top:20px;">
💰 Convertisseur DZD
</p>

<input
id="amount"
type="number"
value="100"
/>

<select id="currency">

<option value="eur">
EUR
</option>

<option value="usd">
USD
</option>

</select>

<p
id="conversion-result"
style="margin-top:15px;font-size:22px;"
>
0 DZD
</p>

</div>

<!-- GOLD -->

<div class="section">

<div class="title">
🪙 Or 24K
</div>

<div class="row">
<span>
Gold 24K (1g)
</span>

<span class="green" id="gold-local">
Chargement...
</span>
</div>

<div class="row">
<span>
Prix international
</span>

<span class="blue" id="gold-rate">
Chargement...
</span>
</div>

<div class="row">
<span>
100g Gold
</span>

<span class="green" id="gold-100g">
Chargement...
</span>
</div>

<p class="small" style="margin-top:20px;">
⚖️ Calculateur Gold
</p>

<input
id="goldAmount"
type="number"
placeholder="Grammes"
/>

<p
id="goldResult"
style="margin-top:15px;font-size:22px;color:#22c55e;"
>
0 DZD
</p>

</div>

</div>

<footer>

© 2026 DZD Market

</footer>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl =
"https://bcmngzompyojuffepstk.supabase.co";

const supabaseKey =
"sb_publishable_8ZqJ7RH9irgwN_0Wo6wD-g_ZjKO8DXS";

const supabaseClient =
supabase.createClient(
supabaseUrl,
supabaseKey
);

let eurSquare = 0;
let usdSquare = 0;
let goldPriceGram = 0;

async function loadRates(){

try{

// OFFICIAL

const eur =
await fetch("https://open.er-api.com/v6/latest/EUR");

const eurData =
await eur.json();

const usd =
await fetch("https://open.er-api.com/v6/latest/USD");

const usdData =
await usd.json();

const eurOfficial =
Math.round(eurData.rates.DZD);

const usdOfficial =
Math.round(usdData.rates.DZD);

// SUPABASE

const { data, error } =
await supabaseClient
.from("square_rates")
.select("*")
.limit(1)
.single();

if(error){

console.log(error);
return;

}

eurSquare = data.eur;
usdSquare = data.usd;
goldPriceGram = data.gold;

// UI

document.getElementById("eur-rate").innerHTML =
`Square: ${eurSquare} | Officiel: ${eurOfficial}`;

document.getElementById("usd-rate").innerHTML =
`Square: ${usdSquare} | Officiel: ${usdOfficial}`;

document.getElementById("gold-local").innerHTML =
goldPriceGram + " DZD";

document.getElementById("gold-rate").innerHTML =
"107 USD";

document.getElementById("gold-100g").innerHTML =
(100 * goldPriceGram).toLocaleString() + " DZD";

updateConverter();

}catch(err){

console.log(err);

}

}

loadRates();

// CONVERTER

function updateConverter(){

const amount =
parseFloat(
document.getElementById("amount").value
);

const currency =
document.getElementById("currency").value;

let result = 0;

if(currency === "eur"){

result = amount * eurSquare;

}else{

result = amount * usdSquare;

}

document.getElementById("conversion-result").innerHTML =
result.toLocaleString() + " DZD";

}

document.getElementById("amount")
.addEventListener("input", updateConverter);

document.getElementById("currency")
.addEventListener("change", updateConverter);

// GOLD

function updateGold(){

const grams =
parseFloat(
document.getElementById("goldAmount").value
);

if(isNaN(grams)){

document.getElementById("goldResult").innerHTML =
"0 DZD";

return;

}

const result =
grams * goldPriceGram;

document.getElementById("goldResult").innerHTML =
result.toLocaleString() + " DZD";

}

document.getElementById("goldAmount")
.addEventListener("input", updateGold);

</script>

</body>
</html>
