<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DZD Market</title>


 <style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020617;
  color:white;
  font-family:Arial, sans-serif;
  padding:20px;
}

h1{
  text-align:center;
  color:#38bdf8;
  margin-bottom:30px;
  font-size:38px;
}

#prix{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#0f172a;
  border:1px solid #1e293b;
  padding:20px;
  border-radius:20px;
  transition:0.3s;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.card:hover{
  transform:translateY(-5px);
  border-color:#38bdf8;
}

.card h2{
  color:#e2e8f0;
  margin-bottom:15px;
}

.price{
  font-size:32px;
  color:#22c55e;
  font-weight:bold;
  margin-bottom:10px;
}

.card p{
  color:#94a3b8;
}
   .header{
  text-align:center;
  margin-bottom:40px;
}

.header p{
  color:#94a3b8;
  margin-top:10px;
  font-size:18px;
}

.card{
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:5px;
  height:100%;
  background:#38bdf8;
}

.update{
  margin-top:15px;
  color:#64748b;
  font-size:14px;
}
   .form{
  margin-top:40px;
  background:#0f172a;
  padding:20px;
  border-radius:20px;
  border:1px solid #1e293b;
}

.form input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  border:none;
  border-radius:10px;
  background:#1e293b;
  color:white;
  font-size:16px;
}

.form button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#38bdf8;
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

.form button:hover{
  opacity:0.8;
}
   #search{
  width:100%;
  padding:15px;
  margin-bottom:25px;
  border:none;
  border-radius:15px;
  background:#0f172a;
  color:white;
  font-size:16px;
  border:1px solid #1e293b;
}
   .image{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:15px;
  margin-bottom:15px;
   }
 </style>
</head>
<body>

<header class="header">
  <h1>DZD market</h1>
  <p>Suivi des prix en Algérie 🇩🇿</p>
</header>
<input 
  type="text" 
  id="search"
  placeholder="🔎 Rechercher..."
  onkeyup="searchPrices()"
/>
<div id="prix"></div>
<div class="form">

  <input type="text" id="devise" placeholder="Nom du produit ou devise">

  <input type="number" id="prixInput" placeholder="Prix en DZD">

  <input type="text" id="source" placeholder="Source">

  <button onclick="addPrice()">Ajouter</button>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://bcmngzompyojuffepstk.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbW5nem9tcHlvanVmZmVwc3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTM2MDYsImV4cCI6MjA5NDk2OTYwNn0.15SBxqm0g2odZgSJi_iJlhTVGn7R3uuP2xH0-kV-Afg";

const { createClient } = supabase;
const client = createClient(supabaseUrl, supabaseKey);

async function loadPrices() {
  const { data, error } = await client
    .from('prix')
    .select('*');
  .order('id', { ascending: false });
  if (error) {
    console.log(error);
    return;
  }

  const recipient = document.getElementById("prix");

  recipient.innerHTML = "";

data.forEach(item => {

  recipient.innerHTML += `
    <div class="card">
    
      <img src="${item.image}" class="image">
      
      <h2>${item.devise}</h2>
      <div class="price">
  ${Number(item.prix).toLocaleString()} DZD
</div>
      <p>📌 ${item.source}</p>
<p>👥 Confirmé par ${item.confirme_par}</p>
<div class="update">🕒 Mise à jour récente</div>
    </div>
  `;

});

}
async function addPrice(){

  const devise = document.getElementById("devise").value;

  const prix = document.getElementById("prixInput").value;

  const source = document.getElementById("source").value;

  const { error } = await client
    .from('prix')
    .insert([
      {
        devise,
        prix,
        source,
        confirme_par: 1
      }
    ]);

  if(error){
    alert("Erreur");
    console.log(error);
    return;
  }

  alert("Prix ajouté ✅");

  loadPrices();

}
  function searchPrices(){

  const value = document
    .getElementById("search")
    .value
    .toLowerCase();

  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {

    if(card.innerText.toLowerCase().includes(value)){
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }

  });

}
loadPrices();
</script>
</body>
</html>
