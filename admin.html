<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin DZD Market</title>
<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px;
}
input{
  padding:10px;
  margin:10px;
  border-radius:10px;
  border:none;
  width:200px;
}
button{
  padding:10px 20px;
  background:#22c55e;
  border:none;
  border-radius:10px;
  cursor:pointer;
  color:white;
}
</style>
</head>

<body>

<h1>🔐 Admin Panel</h1>

<p>EUR Square Price</p>
<input id="eur" type="number" placeholder="Enter EUR DZD">

<p>USD Square Price</p>
<input id="usd" type="number" placeholder="Enter USD DZD">

<br><br>

<button onclick="savePrices()">💾 Save</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://bcmngzompyojuffepstk.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbW5nem9tcHlvanVmZmVwc3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTM2MDYsImV4cCI6MjA5NDk2OTYwNn0.15SBxqm0g2odZgSJi_iJlhTVGn7R3uuP2xH0-kV-Afg";

const { createClient } = supabase;

const client = createClient(supabaseUrl, supabaseKey);

async function savePrices(){

  const eur = document.getElementById("eur").value;

  const usd = document.getElementById("usd").value;

  const { data: userData } = await client.auth.getUser();

  if(!userData.user){

    alert("❌ Please login first");

    window.location.href = "/login.html";

    return;

  }

  const { error } = await client
    .from("square_rates")
    .update({
      eur: eur,
      usd: usd
    })
    .eq("id", 1);

  if(error){

    console.log(error);

    alert("Erreur");

    return;

  }

  alert("✅ Prices updated");

}

</script>

</body>
</html>
