<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin DZD Market</title>
<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px;
}
input{
  padding:10px;
  margin:10px;
  border-radius:10px;
  border:none;
  width:200px;
}
button{
  padding:10px 20px;
  background:#22c55e;
  border:none;
  border-radius:10px;
  cursor:pointer;
  color:white;
}
</style>
</head>

<body>

<h1>🔐 Admin Panel</h1>

<p>EUR Square Price</p>
<input id="eur" type="number" placeholder="Enter EUR DZD">

<p>USD Square Price</p>
<input id="usd" type="number" placeholder="Enter USD DZD">

<br><br>

<button onclick="savePrices()">💾 Save</button>

<script>
function savePrices(){

  const eur = document.getElementById("eur").value;
  const usd = document.getElementById("usd").value;

  localStorage.setItem("eur_square", eur);
  localStorage.setItem("usd_square", usd);

  alert("Saved successfully 🔥");

}
</script>

</body>
</html>
