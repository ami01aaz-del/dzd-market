<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>سعر الدولار في الجزائر اليوم</title>

<meta name="description" content="تعرف على سعر الدولار في الجزائر اليوم في السوق السوداء والسكوار الجزائري.">

<style>
body{
background:#020617;
color:white;
font-family:Arial;
padding:25px;
line-height:2;
}
h1{
color:#38bdf8;
}
.price{
font-size:45px;
color:#22c55e;
margin-top:20px;
}
.card{
background:#0f172a;
padding:20px;
border-radius:20px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>💵 سعر الدولار في الجزائر اليوم</h1>

<div class="card">

<p>
تابع سعر الدولار الأمريكي في الجزائر لحظة بلحظة.
</p>

<div class="price" id="price">
جاري التحميل...
</div>

</div>

<script>

async function load(){

const res = await fetch("https://open.er-api.com/v6/latest/USD");

const data = await res.json();

document.getElementById("price").innerHTML =
Math.round(data.rates.DZD) + " دج";

}

load();

</script>

</body>
</html>
