<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EUR/DZD - DZD Market</title>

<link rel="icon" href="/icon-new.png">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:white;
}

header{
padding:20px;
background:#0f172a;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.back-link{
color:#38bdf8;
text-decoration:none;
font-size:14px;
}

.page-title{
font-size:32px;
margin-top:15px;
font-weight:bold;
}

.page-subtitle{
opacity:0.7;
font-size:14px;
margin-top:10px;
line-height:1.6;
}

.live-badge{
display:inline-flex;
align-items:center;
gap:8px;
margin-top:12px;
padding:6px 12px;
border-radius:999px;
background:rgba(34,197,94,0.1);
border:1px solid rgba(34,197,94,0.2);
color:#22c55e;
font-size:13px;
}

.live-dot{
width:10px;
height:10px;
border-radius:50%;
background:#22c55e;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{opacity:0.3;transform:scale(0.9);}
50%{opacity:1;transform:scale(1.2);}
100%{opacity:0.3;transform:scale(0.9);}
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.top-cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:#0f172a;
border:1px solid rgba(255,255,255,0.05);
border-radius:16px;
padding:18px;
}

.card-label{
opacity:0.7;
font-size:13px;
}

.card-price{
font-size:28px;
font-weight:bold;
margin-top:10px;
}

.green{color:#22c55e;}
.blue{color:#38bdf8;}

.section{
margin-top:20px;
background:#0f172a;
padding:18px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.05);
}

.section-title{
font-size:18px;
margin-bottom:15px;
color:#22c55e;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#162033;
color:white;
font-size:18px;
box-sizing:border-box;
}

.result{
margin-top:15px;
font-size:26px;
font-weight:bold;
color:#22c55e;
}

.chart-tabs{
display:flex;
gap:8px;
margin-bottom:15px;
}

.chart-tab{
padding:6px 12px;
border-radius:999px;
background:#111827;
font-size:13px;
opacity:0.7;
cursor:pointer;
}

.chart-tab.active{
background:#38bdf8;
opacity:1;
color:white;
}

.chart-box{
height:180px;
display:flex;
align-items:flex-end;
justify-content:space-around;
padding:15px;
background:linear-gradient(180deg,rgba(56,189,248,0.12),transparent);
border-radius:14px;
}

.chart-bar{
width:25px;
background:#38bdf8;
border-radius:8px 8px 0 0;
transition:all 0.3s ease;
}

.market-row{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,0.04);
}

.market-row:last-child{
border:none;
}

.related a{
display:block;
margin:6px 0;
color:#38bdf8;
text-decoration:none;
}

</style>

</head>

<body>

<header>

<a class="back-link" href="/">← Retour</a>

<div class="page-title">EUR / DZD</div>

<div class="page-subtitle">
Suivi du prix de l’euro en Algérie (Square & Officiel)
</div>

<div class="live-badge">
<div class="live-dot"></div>
Live Market
</div>

</header>

<div class="container">

<!-- TOP PRICES -->
<div class="top-cards">

<div class="card">
<div class="card-label">Prix Square</div>
<div class="card-price green" id="squarePrice">279 DZD</div>
</div>

<div class="card">
<div class="card-label">Prix Officiel</div>
<div class="card-price blue">154 DZD</div>
</div>

</div>

<!-- CONVERTER -->
<div class="section">

<div class="section-title">Convertisseur</div>

<input type="number" id="amount" value="100">

<div class="result" id="result">27 900 DZD</div>

</div>

<!-- CHART -->
<div class="section">

<div class="section-title">Tendance</div>

<div class="chart-tabs">

<div class="chart-tab active" data-tab="7J">7J</div>
<div class="chart-tab" data-tab="30J">30J</div>
<div class="chart-tab" data-tab="1A">1A</div>

</div>

<div class="chart-box">
<div class="chart-bar"></div>
<div class="chart-bar"></div>
<div class="chart-bar"></div>
<div class="chart-bar"></div>
<div class="chart-bar"></div>
<div class="chart-bar"></div>
<div class="chart-bar"></div>
</div>

</div>

<!-- INFO -->
<div class="section">

<div class="section-title">État du marché</div>

<div class="market-row">
<span>Tendance</span>
<span class="green">+2.3%</span>
</div>

<div class="market-row">
<span>Update</span>
<span>Live</span>
</div>

</div>

<!-- LINKS -->
<div class="section related">

<div class="section-title">Marchés liés</div>

<a href="/usd-dzd.html">USD / DZD</a>
<a href="/gold-dzd.html">Gold 24K</a>
<a href="/">Produits</a>

</div>

</div>

<script>

let eurPrice = 279;

function updateConverter(){
const amount = document.getElementById("amount").value;
document.getElementById("result").innerHTML =
Math.round(amount * eurPrice).toLocaleString() + " DZD";
}

document.getElementById("amount")
.addEventListener("input", updateConverter);

// CHART DATA
const data = {
"7J":[40,55,60,70,80,90,85],
"30J":[30,45,50,60,70,85,95],
"1A":[20,30,45,55,70,80,100]
};

function renderChart(type){

document.querySelectorAll(".chart-tab")
.forEach(t=>t.classList.remove("active"));

document.querySelector(`[data-tab="${type}"]`)
.classList.add("active");

const bars = document.querySelectorAll(".chart-bar");

data[type].forEach((val,i)=>{
bars[i].style.height = val + "px";
});

}

// EVENTS
document.querySelectorAll(".chart-tab")
.forEach(tab=>{
tab.addEventListener("click",()=>{
renderChart(tab.dataset.tab);
});
});

renderChart("7J");
updateConverter();

</script>

</body>
</html>
