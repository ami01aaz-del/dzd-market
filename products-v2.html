<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produits et Prix en Algérie | DZD Market</title>

<meta name="description"
content="Découvrez les produits populaires et leurs prix en Algérie sur DZD Market.">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:white;
}

header{
padding:30px 20px;
text-align:center;
background:#0f172a;
border-bottom:1px solid #1e293b;
}

header h1{
margin:0;
color:#38bdf8;
font-size:34px;
}

header p{
opacity:.8;
margin-top:10px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.search-box{
margin:25px 0;
}

.search-box input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #1e293b;
background:#111827;
color:white;
font-size:16px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:25px;
}

.stat-card{
background:#0f172a;
border:1px solid #1e293b;
border-radius:14px;
padding:20px;
text-align:center;
}

.stat-value{
font-size:28px;
font-weight:bold;
color:#22c55e;
}

.stat-label{
opacity:.7;
margin-top:6px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:20px;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:10px;
margin-bottom:25px;
scrollbar-width:none;
}

.categories::-webkit-scrollbar{
display:none;
}

.cat-btn{
background:#111827;
border:1px solid #1e293b;
color:white;
padding:10px 16px;
border-radius:999px;
cursor:pointer;
white-space:nowrap;
font-size:14px;
}

.cat-btn.active{
background:#22c55e;
border-color:#22c55e;
}

@media(max-width:800px){

.stats{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<h1>
Produits et Prix en Algérie
</h1>

<p>
Découvrez les produits populaires et leurs prix en Algérie
</p>

</header>

<div class="container">

<div class="search-box">
<input
type="text"
placeholder="Rechercher un produit..."
id="searchInput">
</div>

<div class="categories">

<button class="cat-btn active">Tous</button>

<button class="cat-btn">Téléphones</button>

<button class="cat-btn">Ordinateurs</button>

<button class="cat-btn">Gaming</button>

</div>

<div id="productsGrid" class="grid"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const client = supabase.createClient(
"https://bcmngzompyojuffepstk.supabase.co",
"sb_publishable_8ZqJ7RH9irgwN_0Wo6wD-g_ZjKO8DXS"
);

async function loadProducts(){

const { data, error } = await client
.from("products")
.select("*")
.order("id",{ascending:false});

if(error){
console.log(error);
return;
}

const container =
document.getElementById("productsGrid");

container.innerHTML = "";

data.forEach(product=>{

container.innerHTML += `
<a
href="/product-v2.html?slug=${product.slug}"
style="
text-decoration:none;
color:white;
background:#0f172a;
border:1px solid #1e293b;
border-radius:16px;
overflow:hidden;
display:block;
">

<img
src="${product.image_url || 'https://via.placeholder.com/500x300?text=DZD+Market'}"
style="
width:100%;
height:220px;
object-fit:cover;
">

<div style="padding:15px;">

<div style="
font-size:20px;
font-weight:bold;
margin-bottom:10px;
">
${product.title}
</div>

<div style="
font-size:26px;
font-weight:bold;
color:#22c55e;
margin-bottom:10px;
">
${Number(product.price).toLocaleString()} DZD
</div>

<div style="opacity:.7;">
${product.brand || "-"}
</div>

<div style="
margin-top:12px;
color:#38bdf8;
font-weight:bold;
">
Voir le produit →
</div>

</div>

</a>
`;

});

}

loadProducts();

</script>

</body>
</html>
