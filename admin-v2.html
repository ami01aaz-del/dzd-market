<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DZD Admin V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

header{
padding:20px;
text-align:center;
background:#0f172a;
border-bottom:1px solid #1e293b;
}

h1{margin:0;color:#38bdf8;}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.section{
background:#0f172a;
padding:15px;
border-radius:12px;
margin-top:20px;
border:1px solid #1e293b;
}

.title{
font-size:18px;
margin-bottom:10px;
color:#22c55e;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th, td{
padding:10px;
border-bottom:1px solid #1e293b;
text-align:left;
font-size:14px;
}

th{
color:#38bdf8;
font-size:13px;
opacity:0.8;
}

input{
width:100%;
padding:8px;
border:none;
border-radius:6px;
background:#162033;
color:white;
}

.save-bar{
position:sticky;
bottom:0;
background:#0f172a;
padding:15px;
border-top:1px solid #1e293b;
text-align:center;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{opacity:0.9;}

.badge{
padding:3px 8px;
border-radius:6px;
font-size:12px;
background:#1f2937;
}
</style>
</head>

<body>

<header>
<h1>🔐 DZD Admin V2</h1>
<p>Market Control Panel</p>
</header>

<div class="container">

<!-- MARKET ITEMS -->
<div class="section">
<div class="title">💱 Currencies</div>
<table>
<thead>
<tr>
<th>Name</th>
<th>Category</th>
<th>Value</th>
</tr>
</thead>
<tbody id="currencies"></tbody>
</table>
</div>

<div class="section">
<div class="title">🪙 Metals</div>
<table>
<thead>
<tr>
<th>Name</th>
<th>Category</th>
<th>Value</th>
</tr>
</thead>
<tbody id="metals"></tbody>
</table>
</div>

<!-- PRODUCTS -->
<div class="section">
<div class="title">🛒 Products</div>

<div id="productsCount" style="
margin-bottom:10px;
color:#94a3b8;
font-size:14px;
">
Total Products: 0
</div>

<div style="margin-bottom:15px;">
<button onclick="addProduct()">➕ Add Product</button>
</div>

<div style="margin-bottom:15px;">
  <input
    type="text"
    id="searchProduct"
    placeholder="Search product..."
    onkeyup="searchProducts()"
  >
</div>

<table>
<thead>
<tr>
<th>Title</th>
<th>Category</th>
<th>Price</th>
<th>Brand</th>
<th>Image</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="products"></tbody>
</table>
</div>

</div>

<div class="save-bar">
<button onclick="saveAll()">💾 Save All Changes</button>
</div>

<div id="productModal" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
z-index:9999;
">

 <div style="
  width:90%;
  max-width:700px;
  background:#0f172a;
  padding:20px;
  border-radius:12px;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
">

    <h2>Edit Product</h2>
    <img id="previewImage" width="100" style="margin-bottom:10px;border-radius:8px;">

    <input id="editTitle" placeholder="Title">

    <br><br>

    <input id="editPrice" placeholder="Price">

    <br><br>
    
    <br><br>

<input id="editCategory" placeholder="Category">

<br><br>

<input id="editBrand" placeholder="Brand">

<br><br>

<label style="display:block;margin-bottom:5px;">Product Image</label>
<input type="file" id="imageFile">
<br><br>

<br><br>

<textarea
  id="editDescription"
  placeholder="Description"
  style="
    width:100%;
    min-height:120px;
    background:#162033;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px;
  "
></textarea>

<br><br>

<input id="editStatus" placeholder="Status">

 <button onclick="saveProductChanges()">
  Save Changes
</button>

<button onclick="closeModal()">
  Close
</button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://bcmngzompyojuffepstk.supabase.co";
const supabaseKey = "sb_publishable_8ZqJ7RH9irgwN_0Wo6wD-g_ZjKO8DXS";

const client = supabase.createClient(supabaseUrl, supabaseKey);

let items = [];
let currentProductId = null;
let productsData = [];

/* AUTH */
async function checkAuth(){
const { data: { user } } = await client.auth.getUser();

if(!user){
window.location.href = "/login.html";
}
}

/* INIT */
async function init(){
await checkAuth();
await loadData();
await loadProducts();
}

/* LOAD MARKET ITEMS */
async function loadData(){
const { data, error } = await client
.from("market_items")
.select("*");

if(error){
console.log(error);
return;
}

items = data;
renderTable();
}

/* RENDER MARKET ITEMS */
function renderTable(){

document.getElementById("currencies").innerHTML = "";
document.getElementById("metals").innerHTML = "";

items.forEach(item => {

const row = `
<tr>
<td>${item.name}</td>
<td><span class="badge">${item.category}</span></td>
<td>
<input type="number" data-id="${item.id}" value="${item.value}">
</td>
</tr>
`;

if(item.category === "currency"){
document.getElementById("currencies").innerHTML += row;
}

else if(item.category === "gold" || item.category === "silver" || item.type === "metal"){
document.getElementById("metals").innerHTML += row;
}

});

}

/* SAVE MARKET ITEMS */
async function saveAll(){

const inputs = document.querySelectorAll("#currencies input, #metals input");

for(const input of inputs){

await client
.from("market_items")
.update({
value: Number(input.value)
})
.eq("id", input.dataset.id);

}

alert("Saved successfully ✅");
await loadData();
}

/* LOAD PRODUCTS */
async function loadProducts(){

const { data, error } = await client
.from("products")
.select("*")
.order("id", { ascending: false });

if(error){
console.log(error);
return;
}

productsData = data;
renderProducts(data);
}

/* RENDER PRODUCTS */
function renderProducts(products){

  const container = document.getElementById("products");

  container.innerHTML = "";
  
  document.getElementById("productsCount").innerText =
  "Total Products: " + products.length;

  products.forEach(p => {

    container.innerHTML += `
      <tr>
        <td>${p.title}</td>
        <td>${p.category}</td>
        <td>${p.price}</td>
        <td>${p.brand || "-"}</td>
        <td>
          ${p.image_url ? `<img src="${p.image_url}" width="40">` : "-"}
        </td>
        <td>${p.status}</td>
        <td>
  <button
    onclick="editProduct('${p.id}')"
    style="background:#2563eb;color:white;border:none;padding:6px 8px;border-radius:6px;margin-right:5px;">
    Edit
  </button>

  <button
    onclick="deleteProduct('${p.id}')"
    style="background:red;color:white;border:none;padding:6px 8px;border-radius:6px;">
    Delete
  </button>
</td>
      </tr>
    `;
  });
}

/* ADD PRODUCT */
async function addProduct(){

  const title = prompt("Product name");
  if(!title) return;

  const price = prompt("Price") || 0;
  const brand = prompt("Brand (optional)") || "";
  const image_url = prompt("Image URL (optional)") || "";
  const description = prompt("Description (optional)") || "";
  const category = prompt("Category") || "phones";

  const { error } = await client
    .from("products")
    .insert([{
      title: title,
      slug: title.toLowerCase().replace(/\s+/g,"-"),
      price: Number(price),
      category: category,
      brand: brand,
      image_url: image_url,
      description: description,
      status: "active"
    }]);

  if(error){
    alert(error.message);
    return;
  }

  alert("Product added ✅");

  await loadProducts(); // تحديث الجدول
}

async function deleteProduct(id){

  const product = productsData.find(
    p => String(p.id) === String(id)
  );

  const confirmDelete = confirm("Are you sure?");
  if(!confirmDelete) return;

  // 1. حذف الصورة من Storage
  if(product?.image_url){

    try {
      const url = new URL(product.image_url);

      // هذا هو الحل الصحيح 100%
      const path = url.pathname.split("/product-images/")[1];

      console.log("DELETE PATH:", path);

      if(path){
        const { error } = await client.storage
          .from("product-images")
          .remove([path]);

        console.log("STORAGE DELETE ERROR:", error);
      }

    } catch(err){
      console.log("Image delete error:", err);
    }
  }

  // 2. حذف المنتج من قاعدة البيانات
  const { error } = await client
    .from("products")
    .delete()
    .eq("id", id);

  if(error){
    alert(error.message);
    return;
  }

  await loadProducts();
}

  alert("Product deleted successfully ✅");
}

function editProduct(id){

  currentProductId = id;

  const product = productsData.find(
    p => String(p.id) === String(id)
  );

  if(!product) return;

  document.getElementById("editTitle").value =
    product.title || "";

  document.getElementById("editPrice").value =
    product.price || 0;
    
    document.getElementById("editCategory").value =
  product.category || "";

document.getElementById("editBrand").value =
  product.brand || "";

document.getElementById("editDescription").value =
  product.description || "";

document.getElementById("editStatus").value =
  product.status || "active";
  
  document.getElementById("previewImage").src =
  product.image_url || "";

  document.getElementById("productModal").style.display = "block";
}

function closeModal(){
  document.getElementById("productModal").style.display = "none";
}

async function saveProductChanges(){

  let imageUrl = productsData.find(p => p.id == currentProductId)?.image_url || "";

  const fileInput = document.getElementById("imageFile");

  const oldImageUrl = imageUrl;

  // 🔥 إذا المستخدم رفع صورة جديدة
  if(fileInput && fileInput.files.length > 0){

    // حذف الصورة القديمة
    if(oldImageUrl){

      try {
        const url = new URL(oldImageUrl);
        const oldPath = url.pathname.split("/object/public/product-images/")[1];

        if(oldPath){
          await client.storage
            .from("product-images")
            .remove([oldPath]);
        }

      } catch (err){
        console.log("Old image delete error:", err);
      }
    }

    // رفع الصورة الجديدة
    const uploaded = await uploadImage(fileInput.files[0]);

    if(uploaded){
      imageUrl = uploaded;
    }
  }

  // تحديث المنتج
  const { error } = await client
    .from("products")
    .update({
      title: document.getElementById("editTitle").value,
      price: Number(document.getElementById("editPrice").value),
      category: document.getElementById("editCategory").value,
      brand: document.getElementById("editBrand").value,
      description: document.getElementById("editDescription").value,
      image_url: imageUrl,
      status: document.getElementById("editStatus").value
    })
    .eq("id", currentProductId);

  if(error){
    alert(error.message);
    return;
  }

  closeModal();
  await loadProducts();

  alert("Product updated ✅");
}

async function uploadImage(file){

  const product = productsData.find(p => p.id == currentProductId);

const slug = product?.slug || "product";

const fileName = `${slug}-${Date.now()}.jpg`;

  const { data, error } = await client.storage
    .from("product-images")
    .upload("products/" + fileName, file);

  if(error){
    alert("Image upload failed: " + error.message);
    return null;
  }

  const { data: urlData } = client.storage
    .from("product-images")
    .getPublicUrl("products/" + fileName);

  return urlData.publicUrl;
}

function searchProducts(){

  const term = document
    .getElementById("searchProduct")
    .value
    .toLowerCase();

  const filtered = productsData.filter(product =>

    (product.title || "")
      .toLowerCase()
      .includes(term)

    ||

    (product.brand || "")
      .toLowerCase()
      .includes(term)

    ||

    (product.category || "")
      .toLowerCase()
      .includes(term)

  );

  renderProducts(filtered);
}

init();

</script>

</body>
</html>
