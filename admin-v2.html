<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DZD Admin V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

header{
padding:20px;
text-align:center;
background:#0f172a;
border-bottom:1px solid #1e293b;
}

h1{
margin:0;
color:#38bdf8;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

/* SECTIONS */

.section{
background:#0f172a;
padding:15px;
border-radius:12px;
margin-top:20px;
border:1px solid #1e293b;
}

.title{
font-size:18px;
margin-bottom:10px;
color:#22c55e;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th, td{
padding:10px;
border-bottom:1px solid #1e293b;
text-align:left;
font-size:14px;
}

th{
color:#38bdf8;
font-size:13px;
opacity:0.8;
}

input{
width:100%;
padding:8px;
border:none;
border-radius:6px;
background:#162033;
color:white;
}

/* BUTTON */

.save-bar{
position:sticky;
bottom:0;
background:#0f172a;
padding:15px;
border-top:1px solid #1e293b;
text-align:center;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

/* BADGE */

.badge{
padding:3px 8px;
border-radius:6px;
font-size:12px;
background:#1f2937;
}

</style>
</head>

<body>

<header>
<h1>🔐 DZD Admin V2</h1>
<p>Market Control Panel (market_items)</p>
</header>

<div class="container">

<!-- CURRENCIES -->
<div class="section">
<div class="title">💱 Currencies</div>
<table>
<thead>
<tr>
<th>Name</th>
<th>Category</th>
<th>Value (DZD)</th>
</tr>
</thead>
<tbody id="currencies"></tbody>
</table>
</div>

<!-- METALS -->
<div class="section">
<div class="title">🪙 Metals</div>
<table>
<thead>
<tr>
<th>Name</th>
<th>Category</th>
<th>Value (DZD)</th>
</tr>
</thead>
<tbody id="metals"></tbody>
</table>
</div>

<!-- PRODUCTS -->
<div class="section">
<div class="title">🛒 Products</div>
<table>
<thead>
<tr>
<th>Name</th>
<th>Category</th>
<th>Value (DZD)</th>
</tr>
</thead>
<tbody id="products"></tbody>
</table>
</div>

</div>

<!-- SAVE -->
<div class="save-bar">
<button onclick="saveAll()">💾 Save All Changes</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// Supabase
const supabaseUrl = "https://bcmngzompyojuffepstk.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjbW5nem9tcHlvanVmZmVwc3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTM2MDYsImV4cCI6MjA5NDk2OTYwNn0.15SBxqm0g2odZgSJi_iJlhTVGn7R3uuP2xH0-kV-Afg";
  ";
const client = supabase.createClient(supabaseUrl, supabaseKey);

// DATA STORAGE
let items = [];

// CHECK AUTH
async function checkAuth(){

const { data } = await client.auth.getUser();

if(!data.user){
window.location.href = "/login.html";
}

}

// LOAD DATA
async function loadData(){

const { data, error } = await client
.from("market_items")
.select("*");

if(error){
console.log(error);
return;
}

items = data;

renderTable();

}

// RENDER TABLES
function renderTable(){

document.getElementById("currencies").innerHTML = "";
document.getElementById("metals").innerHTML = "";
document.getElementById("products").innerHTML = "";

items.forEach(item => {

let row = `
<tr>
<td>${item.name}</td>
<td><span class="badge">${item.category}</span></td>
<td>
<input type="number"
data-id="${item.id}"
value="${item.value}">
</td>
</tr>
`;

if(item.category === "currency"){
document.getElementById("currencies").innerHTML += row;
}

else if(item.category === "gold" || item.category === "silver" || item.type === "metal"){
document.getElementById("metals").innerHTML += row;
}

else{
document.getElementById("products").innerHTML += row;
}

});

}

// INIT
checkAuth();
loadData();

</script>

</body>
</html>
