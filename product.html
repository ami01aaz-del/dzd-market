<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produit - DZD Market</title>

<meta name="description" content="Produit DZD Market">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.back-btn{
display:inline-block;
margin-bottom:20px;
padding:10px 16px;
background:#1e293b;
color:white;
text-decoration:none;
border-radius:10px;
}

.card{
background:#0f172a;
border-radius:18px;
padding:20px;
border:1px solid rgba(255,255,255,0.06);
}

.product-image{
width:100%;
max-height:450px;
object-fit:cover;
border-radius:16px;
display:block;
}

.title{
font-size:38px;
font-weight:bold;
margin-top:20px;
}

.price{
font-size:42px;
font-weight:bold;
color:#22c55e;
margin-top:15px;
}

.meta{
margin-top:10px;
font-size:15px;
opacity:0.85;
}

.desc{
margin-top:25px;
line-height:1.9;
font-size:16px;
}

.info-box{
margin-top:30px;
padding:20px;
background:#111827;
border-radius:14px;
}

.info-box h3{
margin-top:0;
color:#38bdf8;
}

.info-row{
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.info-row:last-child{
border:none;
}

.related{
margin-top:35px;
}

.related h3{
color:#38bdf8;
}

.related-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:15px;
}

.related-card{
background:#111827;
padding:15px;
border-radius:12px;
text-decoration:none;
color:white;
}

.related-title{
font-weight:bold;
margin-bottom:10px;
}

.related-price{
color:#22c55e;
font-weight:bold;
}

.loading{
text-align:center;
padding:60px;
font-size:20px;
}

@media(max-width:700px){

.title{
font-size:30px;
}

.price{
font-size:34px;
}

}

</style>
</head>

<body>

<div class="container">

<a href="/products.html" class="back-btn">
← Retour aux produits
</a>

<div class="card">

<div id="loading" class="loading">
Chargement...
</div>

<img id="image"
class="product-image"
style="display:none;">

<div id="title" class="title"></div>

<div id="price" class="price"></div>

<div id="brand" class="meta"></div>

<div id="category" class="meta"></div>

<div id="description" class="desc"></div>

<div class="info-box">

<h3>Informations produit</h3>

<div id="infoBrand" class="info-row"></div>

<div id="infoCategory" class="info-row"></div>

<div id="infoPrice" class="info-row"></div>

</div>

<div class="related">

<h3>Produits similaires</h3>

<div id="relatedProducts"
class="related-grid"></div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://bcmngzompyojuffepstk.supabase.co";

const supabaseKey =
"sb_publishable_8ZqJ7RH9irgwN_0Wo6wD-g_ZjKO8DXS";

const client =
supabase.createClient(
supabaseUrl,
supabaseKey
);

async function loadProduct(){

const params =
new URLSearchParams(window.location.search);

const slug =
params.get("slug");

if(!slug){

document.getElementById("loading").innerText =
"Product not found";

return;
}

const { data, error } =
await client
.from("products")
.select("*")
.eq("slug", slug)
.single();

if(error || !data){

document.getElementById("loading").innerText =
"Product not found";

return;
}

document.title =
data.title + " Prix en Algérie - DZD Market";

document
.querySelector('meta[name="description"]')
.setAttribute(
"content",
data.description || data.title
);

document.getElementById("loading").style.display =
"none";

if(data.image_url){

document.getElementById("image").src =
data.image_url;

document.getElementById("image").style.display =
"block";

}

document.getElementById("title").innerText =
data.title;

document.getElementById("price").innerText =
Number(data.price).toLocaleString() + " DZD";

document.getElementById("brand").innerText =
"Brand: " + data.brand;

document.getElementById("category").innerText =
"Category: " + data.category;

document.getElementById("description").innerText =
data.description;

document.getElementById("infoBrand").innerText =
"Marque : " + data.brand;

document.getElementById("infoCategory").innerText =
"Catégorie : " + data.category;

document.getElementById("infoPrice").innerText =
"Prix : " +
Number(data.price).toLocaleString() +
" DZD";

loadRelatedProducts(
data.category,
data.slug
);

}

async function loadRelatedProducts(
category,
currentSlug
){

const { data } =
await client
.from("products")
.select("*")
.eq("category", category)
.limit(6);

const container =
document.getElementById("relatedProducts");

container.innerHTML = "";

data
.filter(
item => item.slug !== currentSlug
)
.forEach(item => {

container.innerHTML += `
<a class="related-card"
href="/product.html?slug=${item.slug}">

<div class="related-title">
${item.title}
</div>

<div class="related-price">
${Number(item.price)
.toLocaleString()} DZD
</div>

</a>
`;

});

}

loadProduct();

</script>

</body>
</html>
